<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Dossiers RDX</title><style>body{margin:0;background:#070a12;color:#f3f6fb;font:16px/1.6 system-ui,sans-serif}.wrap{width:min(1080px,calc(100% - 32px));margin:auto;padding:40px 0}a{color:#6ee7d8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#101624;border:1px solid #263247;border-radius:16px;padding:22px}.muted{color:#9ca9bd}.pill{display:inline-block;border:1px solid #263247;padding:5px 9px;border-radius:999px;margin:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="../index.html">← CÉRÉBRON R&D EXCHANGE</a><h1>Dossiers RDX</h1><p class="muted">Catalogue public en lecture seule. Un dossier SOURCED n’est pas encore VERIFIED.</p><div id="grid" class="grid"><div class="card">Chargement…</div></div></main><script>fetch('../api/v1/catalog.json').then(r=>r.json()).then(d=>{const root=document.querySelector('#grid');root.textContent='';(d.packs||[]).forEach(p=>{const c=document.createElement('article');c.className='card';const h=document.createElement('h2');h.textContent=p.title;const id=document.createElement('div');id.className='muted';id.textContent=p.id+' · '+p.vertical;const st=document.createElement('span');st.className='pill';st.textContent=p.status;const ev=document.createElement('span');ev.className='pill';ev.textContent=p.evidence_summary;c.append(id,h,st,ev);if(p.detail_url){const x=document.createElement('p'),a=document.createElement('a');a.href='../'+String(p.detail_url).replace(/^[/]+/,'');a.textContent='Voir la fiche de preuve';x.appendChild(a);c.appendChild(x)}root.appendChild(c)})}).catch(()=>{document.querySelector('#grid').textContent='Catalogue indisponible. Aucun dossier supplémentaire n’est déduit.'});</script></body></html>
