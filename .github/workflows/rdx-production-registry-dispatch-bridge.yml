name: RDX Production Registry Dispatch Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rdx-production-registry-dispatch-bridge.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.head_commit.message == 'ops: dispatch reviewed production registry PR' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production registry PR workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rdx-production-registry-pr.yml \
            --ref main \
            -f source_review_run_id=36225780029 \
            -f operator_id=dmaillot95-ui
