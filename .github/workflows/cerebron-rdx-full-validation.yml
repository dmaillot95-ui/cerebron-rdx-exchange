name: CEREBRON RDX Full Validation

on:
  push:
    branches: [main]
    paths:
      - 'data/architecton/**'
      - 'data/packs/**'
      - 'data/deployments/**'
      - 'config/**'
      - 'schema/**'
      - 'templates/**'
      - 'dist/**'
      - 'scripts/**'
      - 'vercel.json'
      - '.github/workflows/cerebron-rdx-full-validation.yml'
      - '.github/workflows/rdx-github-pages.yml'
      - '.github/workflows/rdx-public-pack-projection.yml'
      - '.github/workflows/rdx-deployment-readiness.yml'
  pull_request:
    paths:
      - 'data/architecton/**'
      - 'data/packs/**'
      - 'data/deployments/**'
      - 'config/**'
      - 'schema/**'
      - 'templates/**'
      - 'dist/**'
      - 'scripts/**'
      - 'vercel.json'
      - '.github/workflows/cerebron-rdx-full-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run full CEREBRON RDX validation
        run: node scripts/validate-all-rdx.mjs
