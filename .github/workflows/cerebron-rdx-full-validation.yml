name: CEREBRON RDX Full Validation

on:
  push:
    branches: [main]
    paths:
      - 'data/architecton/**'
      - 'data/packs/**'
      - 'config/**'
      - 'schema/**'
      - 'templates/**'
      - 'dist/**'
      - 'scripts/**'
      - 'vercel.json'
      - '.github/workflows/cerebron-rdx-full-validation.yml'
      - '.github/workflows/rdx-github-pages.yml'
      - '.github/workflows/rdx-public-pack-projection.yml'
      - '.github/workflows/rdx-deployment-readiness.yml'
  pull_request:
    paths:
      - 'data/architecton/**'
      - 'data/packs/**'
      - 'config/**'
      - 'schema/**'
      - 'templates/**'
      - 'dist/**'
      - 'scripts/**'
      - 'vercel.json'
      - '.github/workflows/cerebron-rdx-full-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full CEREBRON RDX validation
        run: node scripts/validate-all-rdx.mjs
