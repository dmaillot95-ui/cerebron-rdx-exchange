name: RDX Production Registry One-Shot Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rdx-production-registry-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production registry PR workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rdx-production-registry-pr.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_review_run_id=36225780029 -f operator_id=dmaillot95-ui
