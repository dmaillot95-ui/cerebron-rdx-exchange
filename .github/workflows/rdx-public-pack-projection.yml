name: RDX Public Pack Projection Gate
on:
  push:
    branches: [main]
    paths:
      - 'data/packs/**'
      - 'scripts/build-rdx-public-packs.mjs'
      - 'scripts/validate-deployment-readiness.mjs'
      - 'scripts/validate-site-contract.mjs'
      - 'scripts/validate-hosting-portability.mjs'
      - 'scripts/validate-static-security.mjs'
      - 'dist/api/v1/packs/**'
      - 'dist/dossiers/**'
      - '.github/workflows/rdx-public-pack-projection.yml'
  pull_request:
    paths:
      - 'data/packs/**'
      - 'scripts/build-rdx-public-packs.mjs'
      - 'dist/api/v1/packs/**'
      - 'dist/dossiers/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/build-rdx-public-packs.mjs
      - run: git diff --exit-code -- dist/api/v1/packs dist/dossiers
      - run: node scripts/validate-rdx.mjs
      - run: node scripts/validate-deployment-readiness.mjs
      - run: node scripts/validate-site-contract.mjs
      - run: node scripts/validate-hosting-portability.mjs
      - run: node scripts/validate-static-security.mjs
