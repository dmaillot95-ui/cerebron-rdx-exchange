name: RDX Evidence Gate

on:
  push:
    branches: [main]
    paths:
      - 'data/packs/**'
      - 'scripts/validate-rdx.mjs'
      - '.github/workflows/rdx-evidence-gate.yml'
  pull_request:
    paths:
      - 'data/packs/**'
      - 'scripts/validate-rdx.mjs'
      - '.github/workflows/rdx-evidence-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate all RDX packs
        run: node scripts/validate-rdx.mjs
