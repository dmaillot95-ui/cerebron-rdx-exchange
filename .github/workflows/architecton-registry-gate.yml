name: ARCHITECTON Registry Gate

on:
  push:
    branches: [main]
    paths:
      - 'data/architecton/**'
      - 'schema/architecton-*.json'
      - 'scripts/validate-architecton.mjs'
      - '.github/workflows/architecton-registry-gate.yml'
  pull_request:
    paths:
      - 'data/architecton/**'
      - 'schema/architecton-*.json'
      - 'scripts/validate-architecton.mjs'
      - '.github/workflows/architecton-registry-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ARCHITECTON registry
        run: node scripts/validate-architecton.mjs
