name: ARCHITECTON Ingest Gate

on:
  push:
    branches: [main]
    paths:
      - 'data/architecton/inbox/**'
      - 'schema/architecton-rd-handoff-v1.schema.json'
      - 'scripts/validate-architecton-ingest.mjs'
      - 'scripts/build-architecton-integration-proposal.mjs'
      - 'scripts/build-architecton-phase-advance-proposal.mjs'
      - 'config/architecton-phase-gates.json'
      - '.github/workflows/architecton-ingest-gate.yml'
  pull_request:
    paths:
      - 'data/architecton/inbox/**'
      - 'schema/architecton-rd-handoff-v1.schema.json'
      - 'scripts/validate-architecton-ingest.mjs'
      - '.github/workflows/architecton-ingest-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate R&D handoffs
        run: node scripts/validate-architecton-ingest.mjs
      - name: Build integration proposal
        run: node scripts/build-architecton-integration-proposal.mjs
      - name: Upload integration proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecton-integration-proposal
          path: artifacts/architecton-integration-proposal.json
          if-no-files-found: error
          retention-days: 14
      - name: Build phase advance proposal
        run: node scripts/build-architecton-phase-advance-proposal.mjs
      - name: Upload phase advance proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecton-phase-advance-proposal
          path: artifacts/architecton-phase-advance-proposal.json
          if-no-files-found: error
          retention-days: 14
