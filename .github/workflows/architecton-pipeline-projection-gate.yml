name: ARCHITECTON Pipeline Projection Gate

on:
  push:
    branches: [main]
    paths:
      - 'data/architecton/portfolio-40.json'
      - 'data/architecton/missions/**'
      - 'data/architecton/inbox/**'
      - 'data/architecton/integration-log.json'
      - 'data/architecton/object-registry.json'
      - 'data/architecton/dossiers/**'
      - 'data/architecton/normalization/**'
      - 'dist/api/v1/architecton-pipeline.json'
      - 'scripts/build-architecton-pipeline-status.mjs'
      - '.github/workflows/architecton-pipeline-projection-gate.yml'
  pull_request:
    paths:
      - 'data/architecton/portfolio-40.json'
      - 'data/architecton/missions/**'
      - 'data/architecton/inbox/**'
      - 'data/architecton/integration-log.json'
      - 'data/architecton/object-registry.json'
      - 'data/architecton/dossiers/**'
      - 'data/architecton/normalization/**'
      - 'dist/api/v1/architecton-pipeline.json'
      - 'scripts/build-architecton-pipeline-status.mjs'
      - '.github/workflows/architecton-pipeline-projection-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pipeline projection
        run: node scripts/build-architecton-pipeline-status.mjs --check
