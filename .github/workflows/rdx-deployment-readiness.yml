name: RDX Deployment Readiness Gate

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'vercel.json'
      - 'scripts/validate-deployment-readiness.mjs'
      - 'scripts/validate-hosting-portability.mjs'
      - 'scripts/validate-static-security.mjs'
      - '.github/workflows/rdx-deployment-readiness.yml'
  pull_request:
    paths:
      - 'dist/**'
      - 'vercel.json'
      - 'scripts/validate-deployment-readiness.mjs'
      - '.github/workflows/rdx-deployment-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployable RDX bundle
        run: node scripts/validate-deployment-readiness.mjs
      - name: Validate hosting portability
        run: node scripts/validate-hosting-portability.mjs
      - name: Validate static security policy
        run: node scripts/validate-static-security.mjs
