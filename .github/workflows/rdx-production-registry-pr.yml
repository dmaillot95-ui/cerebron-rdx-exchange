name: RDX Production Registry PR

on:
  workflow_dispatch:
    inputs:
      source_review_run_id:
        description: 'Successful RDX Production Human Review run with APPROVE decision'
        required: true
        type: string
      operator_id:
        description: 'Operator requesting the reviewed registry PR'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read
  attestations: read

jobs:
  propose-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify source human review workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVIEW_RUN_ID: ${{ inputs.source_review_run_id }}
        run: |
          META="$(gh run view "$SOURCE_REVIEW_RUN_ID" --json name,conclusion,event,headBranch,headSha)"
          test "$(jq -r .name <<<"$META")" = "RDX Production Human Review"
          test "$(jq -r .conclusion <<<"$META")" = "success"
          test "$(jq -r .event <<<"$META")" = "workflow_dispatch"
          test "$(jq -r .headBranch <<<"$META")" = "main"
          echo "RDX_REVIEW_WORKFLOW_SHA=$(jq -r .headSha <<<"$META")" >> "$GITHUB_ENV"
      - name: Download signed human review
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVIEW_RUN_ID: ${{ inputs.source_review_run_id }}
        run: gh run download "$SOURCE_REVIEW_RUN_ID" -n rdx-production-human-review -D artifacts/input/review
      - name: Download signed registry update proposal
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVIEW_RUN_ID: ${{ inputs.source_review_run_id }}
        run: gh run download "$SOURCE_REVIEW_RUN_ID" -n rdx-production-registry-update-proposal -D artifacts/input/update
      - name: Verify signed human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify artifacts/input/review/rdx-production-human-review.json --repo "$GITHUB_REPOSITORY" --source-digest "$RDX_REVIEW_WORKFLOW_SHA"
      - name: Verify signed registry update proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify artifacts/input/update/rdx-production-registry-update-proposal.json --repo "$GITHUB_REPOSITORY" --source-digest "$RDX_REVIEW_WORKFLOW_SHA"
      - name: Apply reviewed proposal to worktree only
        env:
          RDX_SIGNED_HUMAN_REVIEW_VERIFIED: 'true'
          RDX_SIGNED_REGISTRY_UPDATE_PROPOSAL_VERIFIED: 'true'
          RDX_APPLY_REGISTRY_PROPOSAL: 'true'
        run: node scripts/apply-production-registry-update-proposal.mjs
      - name: Validate fail-closed production registry
        run: node scripts/validate-production-promotion.mjs
      - name: Ensure only production registry changed
        run: |
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep -q "data/deployments/production-proof-registry.json"
      - name: Commit reviewed registry change to PR branch
        id: commit
        env:
          SOURCE_REVIEW_RUN_ID: ${{ inputs.source_review_run_id }}
          OPERATOR_ID: ${{ inputs.operator_id }}
        run: |
          BRANCH="review/rdx-production-proof-${SOURCE_REVIEW_RUN_ID}-${GITHUB_RUN_ID}"
          git config user.name "cerebron-rdx-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/deployments/production-proof-registry.json
          git commit -m "review: register approved RDX production proof"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Open review PR without auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          SOURCE_REVIEW_RUN_ID: ${{ inputs.source_review_run_id }}
          OPERATOR_ID: ${{ inputs.operator_id }}
        run: |
          gh pr create --base main --head "$BRANCH"             --title "Register reviewed RDX production proof"             --body "Manual reviewed production-proof registry proposal. Source review run: $SOURCE_REVIEW_RUN_ID. Operator: $OPERATOR_ID. No auto-merge; normal PR checks and human review remain required."
