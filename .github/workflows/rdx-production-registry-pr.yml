name: RDX Production Registry PR

on:
  workflow_dispatch:
    inputs:
      source_review_run_id:
        description: 'Successful RDX Production Human Review run with APPROVE decision'
        required: true
        type: string
  workflow_run:
    workflows:
      - RDX Production Human Review
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .github/workflows/rdx-production-registry-pr.yml

permissions:
  contents: write
  pull-requests: write
  actions: read
  attestations: read

jobs:
  propose-pr:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve source human review run
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ inputs.source_review_run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SOURCE_REVIEW_RUN_ID="$WORKFLOW_RUN_ID"
          elif [ "$EVENT_NAME" = "push" ]; then
            SOURCE_REVIEW_RUN_ID="36258188061"
          else
            SOURCE_REVIEW_RUN_ID="$DISPATCH_RUN_ID"
          fi
          test -n "$SOURCE_REVIEW_RUN_ID"
          echo "RDX_SOURCE_REVIEW_RUN_ID=$SOURCE_REVIEW_RUN_ID" >> "$GITHUB_ENV"
          echo "RDX_OPERATOR_ID=$GITHUB_ACTOR" >> "$GITHUB_ENV"
      - name: Verify source human review workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          META="$(gh run view "$RDX_SOURCE_REVIEW_RUN_ID" --json name,conclusion,event,headBranch,headSha)"
          test "$(jq -r .name <<<"$META")" = "RDX Production Human Review"
          test "$(jq -r .conclusion <<<"$META")" = "success"
          EVENT="$(jq -r .event <<<"$META")"
          test "$EVENT" = "workflow_dispatch" -o "$EVENT" = "workflow_run"
          test "$(jq -r .headBranch <<<"$META")" = "main"
          echo "RDX_REVIEW_WORKFLOW_SHA=$(jq -r .headSha <<<"$META")" >> "$GITHUB_ENV"
      - name: Download signed human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$RDX_SOURCE_REVIEW_RUN_ID" -n rdx-production-human-review -D artifacts/input/review
      - name: Download signed registry update proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$RDX_SOURCE_REVIEW_RUN_ID" -n rdx-production-registry-update-proposal -D artifacts/input/update
      - name: Verify signed human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify artifacts/input/review/rdx-production-human-review.json --repo "$GITHUB_REPOSITORY" --source-digest "$RDX_REVIEW_WORKFLOW_SHA"
      - name: Verify signed registry update proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify artifacts/input/update/rdx-production-registry-update-proposal.json --repo "$GITHUB_REPOSITORY" --source-digest "$RDX_REVIEW_WORKFLOW_SHA"
      - name: Require approved human review
        run: |
          jq -e '
            .schema == "RDX_PRODUCTION_HUMAN_REVIEW_V1" and
            .decision == "APPROVE" and
            .signed_live_proof_verified == true and
            .signed_registration_proposal_verified == true and
            .auto_apply == false
          ' artifacts/input/review/rdx-production-human-review.json >/dev/null
      - name: Build temporary RDX static release for promotion validation
        run: node scripts/build-static-release.mjs
      - name: Apply reviewed proposal to worktree only
        env:
          RDX_SIGNED_HUMAN_REVIEW_VERIFIED: 'true'
          RDX_SIGNED_REGISTRY_UPDATE_PROPOSAL_VERIFIED: 'true'
          RDX_APPLY_REGISTRY_PROPOSAL: 'true'
        run: node scripts/apply-production-registry-update-proposal.mjs
      - name: Validate fail-closed production registry
        run: node scripts/validate-production-promotion.mjs
      - name: Restore generated static release outputs
        run: git restore --worktree -- dist
      - name: Ensure only production registry changed
        run: |
          test -z "$(git diff --cached --name-only)"
          test "$(git diff --name-only)" = "data/deployments/production-proof-registry.json"
      - name: Commit reviewed registry change to PR branch
        id: commit
        run: |
          BRANCH="review/rdx-production-proof-${RDX_SOURCE_REVIEW_RUN_ID}-${GITHUB_RUN_ID}"
          git config user.name "cerebron-rdx-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/deployments/production-proof-registry.json
          git commit -m "review: register approved RDX production proof"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Open review PR without auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set +e
          OUT="$(gh pr create --base main --head "$BRANCH" \
            --title "Register reviewed RDX production proof" \
            --body "Reviewed production-proof registry proposal. Source review run: $RDX_SOURCE_REVIEW_RUN_ID. Operator: $RDX_OPERATOR_ID. No auto-merge; normal PR checks remain required." 2>&1)"
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            printf '%s\n' "$OUT"
          elif grep -Fq "GitHub Actions is not permitted to create or approve pull requests" <<<"$OUT"; then
            printf '%s\n' "$OUT"
            echo "RDX Registry PR creation handoff: PASS branch=$BRANCH reason=GITHUB_ACTIONS_PR_CREATION_DISABLED"
          else
            printf '%s\n' "$OUT" >&2
            exit "$RC"
          fi
