name: ARCHITECTON Integration Decision Gate

on:
  push:
    branches: [main]
    paths:
      - 'data/architecton/integration-log.json'
      - 'data/architecton/object-registry.json'
      - 'config/architecton-integration-policy.json'
      - 'templates/architecton-integration-decision-v1.json'
      - 'scripts/validate-architecton-integration-log.mjs'
      - '.github/workflows/architecton-integration-decision-gate.yml'
  pull_request:
    paths:
      - 'data/architecton/integration-log.json'
      - 'data/architecton/object-registry.json'
      - 'config/architecton-integration-policy.json'
      - 'templates/architecton-integration-decision-v1.json'
      - 'scripts/validate-architecton-integration-log.mjs'
      - '.github/workflows/architecton-integration-decision-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate integration decisions
        run: node scripts/validate-architecton-integration-log.mjs
