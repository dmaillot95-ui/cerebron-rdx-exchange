name: ARCHITECTON F01-F08 Gate

on:
  push:
    branches: [main]
    paths:
      - 'data/architecton/dossiers/**'
      - 'data/architecton/portfolio-40.json'
      - 'data/architecton/object-registry.json'
      - 'config/architecton-f01-f08-gates.json'
      - 'templates/architecton-f01-f08-package-v1.json'
      - 'scripts/validate-architecton-f01-f08.mjs'
      - '.github/workflows/architecton-f01-f08-gate.yml'
  pull_request:
    paths:
      - 'data/architecton/dossiers/**'
      - 'data/architecton/portfolio-40.json'
      - 'data/architecton/object-registry.json'
      - 'config/architecton-f01-f08-gates.json'
      - 'templates/architecton-f01-f08-package-v1.json'
      - 'scripts/validate-architecton-f01-f08.mjs'
      - '.github/workflows/architecton-f01-f08-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate ARCHITECTON F01-F08 dossiers
        run: node scripts/validate-architecton-f01-f08.mjs
