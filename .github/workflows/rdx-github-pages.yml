name: RDX GitHub Pages Public Preview

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'data/packs/**'
      - 'data/architecton/**'
      - 'data/deployments/**'
      - 'config/**'
      - 'schema/**'
      - 'templates/**'
      - 'scripts/**'
      - 'vercel.json'
      - '.github/workflows/rdx-github-pages.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after repository Pages is enabled with Source = GitHub Actions'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: rdx-github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      attestation_sha256: ${{ steps.attestation_meta.outputs.attestation_sha256 }}
      signed_verified: ${{ steps.attestation_meta.outputs.signed_verified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shared RDX static release
        run: node scripts/build-static-release.mjs
      - name: Verify canonical public projections remain synchronized
        run: git diff --exit-code -- dist/api/v1/packs dist/dossiers dist/api/v1/architecton-40.json dist/api/v1/architecton-missions.json dist/api/v1/architecton-wave-01.json dist/api/v1/architecton-pipeline.json
      - name: Signed GitHub provenance attestation
        id: signed_attestation
        uses: actions/attest@v4
        with:
          subject-path: artifacts/rdx-release-attestation.json
      - name: Verify signed GitHub provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify artifacts/rdx-release-attestation.json \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA"
      - name: Export verified attestation metadata
        id: attestation_meta
        run: |
          echo "attestation_sha256=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('artifacts/rdx-release-attestation.json','utf8'));process.stdout.write(a.attestation_sha256)")" >> "$GITHUB_OUTPUT"
          echo "signed_verified=true" >> "$GITHUB_OUTPUT"
      - name: Upload release attestation
        uses: actions/upload-artifact@v4
        with:
          name: rdx-release-attestation
          path: artifacts/rdx-release-attestation.json
          retention-days: 90
      - name: Upload public dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy public RDX site
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: [validate, deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed RDX endpoints
        env:
          RDX_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          RDX_SIGNED_RELEASE_ATTESTATION_VERIFIED: ${{ needs.validate.outputs.signed_verified }}
          RDX_RELEASE_ATTESTATION_SHA256: ${{ needs.validate.outputs.attestation_sha256 }}
        run: node scripts/verify-live-deployment.mjs
      - name: Signed production deployment proof
        id: signed_live_proof
        uses: actions/attest@v4
        with:
          subject-path: artifacts/rdx-production-deployment-proof.json
      - name: Verify signed production deployment proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify artifacts/rdx-production-deployment-proof.json \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA"
      - name: Mark signed live proof verified
        run: echo "RDX_SIGNED_LIVE_PROOF_VERIFIED=true" >> "$GITHUB_ENV"
      - name: Upload production deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: rdx-production-deployment-proof
          path: artifacts/rdx-production-deployment-proof.json
          retention-days: 90
      - name: Build production proof registration proposal
        run: node scripts/build-production-proof-registration-proposal.mjs
      - name: Validate production proof registration proposal
        run: node scripts/validate-production-proof-registration-proposal.mjs
      - name: Upload production proof registration proposal
        uses: actions/upload-artifact@v4
        with:
          name: rdx-production-proof-registration-proposal
          path: artifacts/rdx-production-proof-registration-proposal.json
          retention-days: 90
      - name: Build known-good rollback baseline proposal
        run: node scripts/build-known-good-release-proposal.mjs
      - name: Validate known-good rollback baseline proposal
        run: node scripts/validate-known-good-release-proposal.mjs
      - name: Upload known-good rollback baseline proposal
        uses: actions/upload-artifact@v4
        with:
          name: rdx-known-good-release-registration-proposal
          path: artifacts/rdx-known-good-release-registration-proposal.json
          retention-days: 90
