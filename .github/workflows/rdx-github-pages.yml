name: RDX GitHub Pages Public Preview

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'data/packs/**'
      - 'scripts/validate-*.mjs'
      - 'scripts/build-rdx-public-packs.mjs'
      - 'vercel.json'
      - '.github/workflows/rdx-github-pages.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after repository Pages is enabled with Source = GitHub Actions'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: rdx-github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shared RDX static release
        run: node scripts/build-static-release.mjs
      - name: Verify canonical public projections remain synchronized
        run: git diff --exit-code -- dist/api/v1/packs dist/dossiers dist/api/v1/architecton-40.json dist/api/v1/architecton-missions.json dist/api/v1/architecton-wave-01.json dist/api/v1/architecton-pipeline.json
      - name: Signed GitHub provenance attestation
        id: signed_attestation
        uses: actions/attest@v4
        with:
          subject-path: artifacts/rdx-release-attestation.json
      - name: Verify signed GitHub provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify artifacts/rdx-release-attestation.json \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA"
      - name: Upload release attestation
        uses: actions/upload-artifact@v4
        with:
          name: rdx-release-attestation
          path: artifacts/rdx-release-attestation.json
          retention-days: 90
      - name: Upload public dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy public RDX site
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed RDX endpoints
        env:
          RDX_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-live-deployment.mjs
      - name: Upload production deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: rdx-production-deployment-proof
          path: artifacts/rdx-production-deployment-proof.json
          retention-days: 90
