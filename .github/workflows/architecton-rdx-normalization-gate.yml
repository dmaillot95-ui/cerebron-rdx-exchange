name: ARCHITECTON RDX Normalization Gate

on:
  push:
    branches: [main]
    paths:
      - 'data/architecton/normalization/**'
      - 'data/architecton/object-registry.json'
      - 'config/architecton-rdx-normalization.json'
      - 'config/evidence-semantics-bridge.json'
      - 'templates/architecton-rdx-normalization-v1.json'
      - 'scripts/validate-architecton-rdx-normalization.mjs'
      - '.github/workflows/architecton-rdx-normalization-gate.yml'
  pull_request:
    paths:
      - 'data/architecton/normalization/**'
      - 'data/architecton/object-registry.json'
      - 'config/architecton-rdx-normalization.json'
      - 'config/evidence-semantics-bridge.json'
      - 'templates/architecton-rdx-normalization-v1.json'
      - 'scripts/validate-architecton-rdx-normalization.mjs'
      - '.github/workflows/architecton-rdx-normalization-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate ARCHITECTON to RDX normalization
        run: node scripts/validate-architecton-rdx-normalization.mjs
